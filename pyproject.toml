[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careercompiler"
version = "0.1.0"
description = "Profile-Backed, Deterministic Resume Tailoring Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anoop Nair" }
]
dependencies = [
    "pydantic==2.13.5",
    "ortools==9.15.6755",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.3",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "httpx>=0.27.0",
]

[project.scripts]
careercompiler = "careercompiler.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["careercompiler*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
